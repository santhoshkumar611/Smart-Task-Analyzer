<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Smart Task Analyzer</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="container">
    <h1>Smart Task Analyzer</h1>

    <label>Paste Tasks JSON</label>
    <textarea id="tasksInput" placeholder="Paste tasks JSON here..."></textarea>

    <label>Priority Strategy</label>
    <select id="strategy">
        <option value="smart">Smart Balance</option>
        <option value="fast">Fastest Wins</option>
        <option value="impact">High Impact</option>
        <option value="deadline">Deadline Driven</option>
    </select>

    <button onclick="analyzeTasks()">Analyze Tasks</button>

    <div id="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
